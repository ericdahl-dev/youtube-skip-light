<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 200px;
      font-family: system-ui, sans-serif;
      padding: 12px;
      text-align: center;
    }
    #skipBtn {
      width: 100%;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #e5e7eb;
      color: #9ca3af;
      transition: background 0.15s;
    }
    #skipBtn.available {
      background: #22c55e;
      color: white;
    }
    #skipBtn.available:hover {
      background: #16a34a;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <button id="skipBtn" disabled>No ad</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
